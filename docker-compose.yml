services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: brench:local
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      # Keep the unauthenticated UI/API off the public network. Reach it with SSH forwarding.
      - "127.0.0.1:${BRENCH_PORT:-8765}:8765"
    volumes:
      - brench-runs:/app/runs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=2).read()"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Development-only database service. The current app does not use this DB;
  # run it explicitly with `docker compose --profile database up -d db`.
  db:
    image: postgres:16-alpine
    profiles: [database]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brench}
      POSTGRES_USER: ${POSTGRES_USER:-brench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brench-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - brench-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  brench-runs:
  brench-postgres:
