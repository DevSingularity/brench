services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brench}
      POSTGRES_USER: ${POSTGRES_USER:-brench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brench-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - brench-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  brench-postgres:
